<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Flate Engine Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    button { margin: 12px 0; padding: 8px 14px; }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>PDF Flate Engine Test</h1>
  <p>Temporary engine validation page. This is not the production tool UI.</p>
  <input id="file" type="file" accept="application/pdf">
  <br>
  <button id="run">Run Compression Test</button>
  <pre id="output">Select a PDF and run the test.</pre>

  <script type="module">
    import { PdfCompressor } from '../assets/js/pdf/PdfCompressor.js';
    import { FlateDecode } from '../assets/js/streams/filters/FlateDecode.js';
    import { FlateEncode } from '../assets/js/streams/filters/FlateEncode.js';

    const fileInput = document.getElementById('file');
    const output = document.getElementById('output');

    const formatBytes = (bytes) => {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    };

    const equalBytes = (a, b) =>
      a.length === b.length && a.every((value, index) => value === b[index]);

    const run = async () => {
      const file = fileInput.files?.[0];
      if (!file) {
        output.textContent = 'Select a PDF first.';
        return;
      }

      output.textContent = 'Running...';

      try {
        const source = new Uint8Array(await file.arrayBuffer());

        const samples = [
          new TextEncoder().encode('Hello PDF Flate test. '.repeat(200)),
          new Uint8Array(1024).fill(65),
          new Uint8Array(source)
        ];

        const flateResults = [];
        for (const sample of samples) {
          const encoded = FlateEncode.encode(sample);
          const decoded = FlateDecode.decode(encoded);
          flateResults.push({
            input: sample.length,
            encoded: encoded.length,
            roundTrip: equalBytes(sample, decoded)
          });
        }

        const result = await PdfCompressor.compressWithReport(source, {
          level: 'recommended',
          compressStreams: true
        });

        output.textContent = JSON.stringify({
          flateRoundTrips: flateResults,
          compression: {
            original: formatBytes(result.originalSize),
            compressed: formatBytes(result.compressedSize),
            rebuilt: formatBytes(result.rebuiltSize),
            saved: formatBytes(result.savedBytes),
            reductionPercent: result.reductionPercent,
            grew: result.grew,
            fallbackUsed: result.fallbackUsed,
            writerMode: result.writerMode,
            streams: result.streams,
            images: result.images
          }
        }, null, 2);
      } catch (error) {
        output.textContent = 'TEST FAILED\n\n' + (error?.stack || error?.message || String(error));
      }
    };

    document.getElementById('run').addEventListener('click', run);
  </script>
</body>
</html>
